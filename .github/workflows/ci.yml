name: CI security gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: omi-frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_URL: https://security-ci.omitech.com.br
      NEXT_PUBLIC_SITE_URL: https://security-ci.omitech.com.br
      API_URL: https://security-ci-api.omitech.com.br
      NEXT_PUBLIC_API_URL: https://security-ci-api.omitech.com.br/api/v1
      AUTH_SECRET: ci-placeholder-not-a-production-secret
      PORTAL_ACCESS_KEY: ci-placeholder-not-a-production-secret
      CHECKOUT_CLIENT_IP_KEY: ci-placeholder-not-a-production-secret
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      ANALYTICS_INGESTION_KEY: ci-placeholder-not-a-production-secret

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan current tree for secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner --exit-code=1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, lint, and build
        run: |
          pnpm test
          pnpm lint
          pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Run static security analysis
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          semgrep/semgrep:1.145.2@sha256:791a85e244b61e83ef96364997fd069f33e78ce2c4b5541d7bee22f07ee117c9
          semgrep scan --config p/typescript --config p/react --error --metrics=off --no-git-ignore
          /src/app /src/lib /src/components /src/auth.ts /src/proxy.ts

      - name: Scan dependencies and configuration
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
          fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 /repo
